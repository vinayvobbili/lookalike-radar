name: release

# Trusted Publishing (OIDC) — no API tokens. A pending publisher must be
# registered on PyPI matching: workflow file `release.yml`, environment `pypi`,
# owner/repo vinayvobbili/lookalike-radar.
#
#   - push a tag `v*`   -> build + publish to PyPI
#   - run manually      -> build + publish to PyPI (re-publish / recovery)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
